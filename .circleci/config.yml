version: 2.1

orbs:
  snyk: snyk/snyk@2.3.0

jobs:
  # SNYK_SCAN - Snyk Open Source (SCA): scan Maven dependencies in pom.xml
  snyk_scan:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - maven-v1-{{ checksum "pom.xml" }}
            - maven-v1-
      - run:
          name: Resolve Maven dependencies
          command: mvn -B dependency:tree
      - snyk/scan:
          severity-threshold: high
          cli-version: 1.1308.1
          monitor-on-build: false
          args: -d

  # SNYK_CODE - Snyk Code (SAST): static analysis of src/
  snyk_code:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - snyk/scan:
          command: code test
          severity-threshold: high
          cli-version: 1.1308.1
          monitor-on-build: false

  build-test-and-publish:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - maven-v1-{{ checksum "pom.xml" }}
            - maven-v1-
      - run:
          name: Test and package
          command: mvn -B clean verify
      - save_cache:
          key: maven-v1-{{ checksum "pom.xml" }}
          paths:
            - ~/.m2
      - setup_remote_docker
      - run:
          name: Build container image
          command: docker build -t "$DOCKERHUB_USERNAME/devops-demo:$CIRCLE_SHA1" -t "$DOCKERHUB_USERNAME/devops-demo:latest" .
      - when:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - run:
                name: Publish image from main
                command: |
                  echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
                  docker push "$DOCKERHUB_USERNAME/devops-demo:$CIRCLE_SHA1"
                  docker push "$DOCKERHUB_USERNAME/devops-demo:latest"

  deploy:
    docker:
      - image: cimg/node:lts
    steps:
      - run:
          name: Redeploy latest image on Railway
          command: npx --yes @railway/cli redeploy --service "$RAILWAY_SERVICE_ID" --yes

workflows:
  build-test-and-publish:
    jobs:
      - snyk_scan
      - snyk_code
      - build-test-and-publish:
          requires:
            - snyk_scan
            - snyk_code
      - deploy:
          requires:
            - build-test-and-publish
          filters:
            branches:
              only: main
